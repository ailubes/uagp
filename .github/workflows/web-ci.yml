name: UAGP web checks

on:
  pull_request:
    paths:
      - 'web/**'
      - '.github/workflows/web-ci.yml'
  push:
    branches:
      - 'feat/web-001-public-workspace'
    paths:
      - 'web/**'
      - '.github/workflows/web-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: uagp-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    defaults:
      run:
        working-directory: web
    env:
      UAGP_DATA_MODE: snapshot
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Next.js production build
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Desktop and mobile browser checks
        run: npm run test:e2e
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uagp-web-browser-evidence
          path: |
            web/test-results/
            web/playwright-report/
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload resolved dependency lock for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uagp-web-package-lock
          path: web/package-lock.json
          if-no-files-found: ignore
          retention-days: 14
